<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSUR - Notas</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">IPSUR</a>
            <nav>
                <a href="admin.html" class="btn-admin">Panel Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Notas y Articulos</h1>
            <p>Publicaciones recientes de nuestro equipo</p>
        </section>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Cargando notas...</p>
        </div>

        <div id="no-notes" class="no-notes" style="display:none;">
            <p>No hay notas publicadas aun.</p>
        </div>

        <div id="notes-grid" class="notes-grid"></div>
    </main>

    <!-- Modal para ver nota completa -->
    <div id="note-modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <img id="modal-image" src="" alt="">
            <h2 id="modal-title"></h2>
            <div class="modal-meta">
                <span id="modal-author" class="modal-author"></span>
                <span id="modal-date" class="modal-date"></span>
            </div>
            <div id="modal-text" class="modal-text"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 IPSUR. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
