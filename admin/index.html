<!DOCTYPE html>
<html lang="es" data-module="cms-publicaciones autenticacion">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSUR — Panel de Administración</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <script src="../js/core/paths.js"></script>
</head>
<body style="background:var(--bg);">

<!-- Header -->
<header class="admin-site-header">
    <div class="container">
        <div class="admin-header-inner">
            <a href="../index.html" class="admin-brand">IPSUR</a>
            <div class="admin-header-right">
                <span id="user-display" class="user-badge-pill" style="display:none;"></span>
                <a href="../index.html" class="btn outline" style="padding:.5rem 1rem; font-size:.82rem;">Ver sitio</a>
            </div>
        </div>
    </div>
</header>

<!-- Login -->
<main id="login-screen" class="container">
    <div class="login-card">
        <h1>Panel de Administración</h1>
        <p>Ingresá tus credenciales para publicar notas</p>
        <form class="login-form" id="login-form">
            <input type="text" id="username-input" placeholder="Usuario" required autocomplete="username">
            <input type="password" id="password-input" placeholder="Contraseña" required autocomplete="current-password">
            <button type="submit" class="btn" style="border-radius:12px;">Ingresar</button>
        </form>
        <p id="login-error" class="error-msg" style="display:none;">Usuario o contraseña incorrectos</p>
    </div>
</main>

<!-- Panel Admin -->
<main id="admin-panel" class="container admin-main" style="display:none;">

    <div class="admin-section-header">
        <h1 id="form-title">Publicar nueva nota</h1>
        <div class="admin-header-btns">
            <div class="cancel-btn-wrap" id="cancel-btn-wrap">
                <button class="btn-secondary" onclick="cancelEdit()">Cancelar edición</button>
            </div>
            <button class="btn-secondary" onclick="logout()">Cerrar sesión</button>
        </div>
    </div>

    <!-- Formulario -->
    <div class="note-form-card">
        <form id="note-form">
            <div class="form-group">
                <label for="note-title">Título</label>
                <input type="text" id="note-title" placeholder="Título de la nota" required>
            </div>

            <div class="form-group">
                <label for="note-image">Imagen</label>
                <input type="file" id="note-image" accept="image/*">
                <p id="image-hint" class="hint-text" style="display:none;">Dejá vacío para mantener la imagen actual</p>
                <div id="image-preview" class="image-preview"></div>
            </div>

            <div class="form-group">
                <label>Contenido</label>
                <div id="editor-container">
                    <div id="editor"></div>
                </div>
            </div>

            <div id="upload-progress" class="progress-wrap" style="display:none;">
                <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
                <p id="progress-text" class="progress-text">Guardando...</p>
            </div>

            <button type="submit" id="submit-btn" class="btn" style="width:100%; margin-top:8px; border-radius:12px; padding:.85rem;">
                Publicar nota
            </button>
        </form>
    </div>

    <hr class="divider">

    <!-- Lista de notas del usuario -->
    <div class="admin-notes-section">
        <h2>Mis notas publicadas</h2>
        <div id="admin-notes-list" class="admin-notes-list"></div>
    </div>

</main>

<footer class="site-footer" style="margin-top:auto;">
    <div class="container">
        <div class="footer-bottom" style="border-top:none; padding-top:0;">
            <p>&copy; 2026 IPSUR — Instituto Político del Sur.</p>
        </div>
    </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="../js/core/firebase-config.js"></script>
<script src="../js/services/admin.js"></script>
</body>
</html>
