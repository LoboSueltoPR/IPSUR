<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSUR - Panel de Administracion</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Quill Editor -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">IPSUR</a>
            <nav class="header-nav">
                <span id="user-display" class="user-badge" style="display:none;"></span>
                <a href="index.html" class="btn-admin">Ver Notas</a>
            </nav>
        </div>
    </header>

    <!-- Pantalla de Login -->
    <main id="login-screen" class="container">
        <section class="login-box">
            <h1>Panel de Administracion</h1>
            <p>Ingresa tus credenciales para publicar notas</p>
            <form id="login-form">
                <input type="text" id="username-input" placeholder="Usuario" required autocomplete="username">
                <input type="password" id="password-input" placeholder="Contrasena" required autocomplete="current-password">
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
            <p id="login-error" class="error-msg" style="display:none;">Usuario o contrasena incorrectos</p>
        </section>
    </main>

    <!-- Panel de Admin (oculto hasta login) -->
    <main id="admin-panel" class="container" style="display:none;">
        <section class="admin-header">
            <h1 id="form-title">Publicar Nueva Nota</h1>
            <div class="admin-header-btns">
                <button id="cancel-edit-btn" class="btn-secondary" style="display:none;" onclick="cancelEdit()">Cancelar Edicion</button>
                <button id="logout-btn" class="btn-secondary" onclick="logout()">Cerrar Sesion</button>
            </div>
        </section>

        <form id="note-form" class="note-form">
            <div class="form-group">
                <label for="note-title">Titulo</label>
                <input type="text" id="note-title" placeholder="Titulo de la nota" required>
            </div>

            <div class="form-group">
                <label for="note-image">Imagen</label>
                <input type="file" id="note-image" accept="image/*">
                <div id="image-preview" class="image-preview"></div>
                <p id="image-hint" class="hint-text" style="display:none;">Deja vacio para mantener la imagen actual</p>
            </div>

            <div class="form-group">
                <label>Contenido</label>
                <div id="editor-container">
                    <div id="editor"></div>
                </div>
            </div>

            <div id="upload-progress" class="upload-progress" style="display:none;">
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <p id="progress-text">Subiendo...</p>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary btn-large">Publicar Nota</button>
        </form>

        <hr class="divider">

        <section class="admin-notes">
            <h2>Mis Notas</h2>
            <div id="admin-notes-list" class="admin-notes-list"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 IPSUR. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
