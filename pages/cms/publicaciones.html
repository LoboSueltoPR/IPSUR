</main>

<!-- Modal nota completa -->
<div id="note-modal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <img id="modal-image" src="" alt="" style="width:100%; border-radius:12px; margin-bottom:1.5rem; display:none;">
        <div id="modal-youtube-container" style="display:none; width:100%; aspect-ratio:16/9; margin-bottom:1.5rem; border-radius:12px; overflow:hidden;">
            <iframe id="modal-youtube" width="100%" height="100%" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <h2 id="modal-title" style="margin-bottom:1rem; font-size:2rem; line-height:1.2;"></h2>
        <div class="modal-meta" style="display:flex; align-items:center; gap:1rem; margin-bottom:2rem; padding-bottom:1rem; border-bottom:1px solid rgba(255,255,255,0.1);">
            <img id="modal-author-img" src="" alt="" style="width:40px; height:40px; border-radius:50%; object-fit:cover; display:none;">
            <div>
                <span id="modal-author" class="modal-author" style="display:block; font-weight:600; font-size:0.95rem;"></span>
                <span id="modal-date" class="modal-date" style="display:block; font-size:0.85rem; color:var(--text-muted);"></span>
            </div>
        </div>
        <div id="modal-text" class="modal-text" style="line-height:1.7;"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../../js/core/firebase-config.js"></script>

<script src="../../js/services/app.js"></script>
</body>
</html>
