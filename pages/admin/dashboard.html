<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — IPSUR Admin</title>
    <link rel="icon" href="../../assets/images/logo.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="../../js/core/paths.js"></script>
</head>
<body class="admin-body">

    <header class="admin-header">
        <div class="admin-header-left">
            <img src="../../assets/images/logo.png" alt="IPSUR">
            <h2>Panel de Administración</h2>
        </div>
        <div class="admin-header-right">
            <span class="admin-user" id="admin-user-email">Cargando...</span>
            <button id="btn-logout" class="btn outline btn-sm">Cerrar Sesión</button>
        </div>
    </header>

    <main class="admin-container">
        <nav class="admin-nav">
            <button class="admin-tab active" data-target="sec-publicaciones">Publicaciones</button>
            <button class="admin-tab" data-target="sec-agenda">Agenda</button>
        </nav>

        <!-- SECCIÓN PUBLICACIONES -->
        <section id="sec-publicaciones" class="admin-section active">
            <div class="admin-panel-grid">
                <!-- Columna Izquierda: Formulario -->
                <div class="admin-form-card">
                    <h3>Nueva Publicación</h3>
                    <form id="form-pub" class="contact-form">
                        <div class="form-group">
                            <label>Título</label>
                            <input type="text" id="pub-title" required>
                        </div>
                        <div class="form-group">
                            <label>Autor (Nombre)</label>
                            <input type="text" id="pub-author" required>
                        </div>
                        <div class="form-group">
                            <label>Foto del Autor (opcional)</label>
                            <input type="file" id="pub-author-img" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Imagen de Portada</label>
                            <input type="file" id="pub-cover-img" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Link de YouTube (opcional)</label>
                            <input type="url" id="pub-youtube" placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <div class="form-group">
                            <label>Contenido / Texto</label>
                            <div id="pub-content-editor" style="height: 250px; background: #fff; border-bottom-left-radius: 10px; border-bottom-right-radius: 10px;"></div>
                            <input type="hidden" id="pub-content">
                        </div>
                        <div style="display:flex; gap:1rem; margin-top:1rem;">
                            <button type="submit" class="btn" id="btn-pub-submit" style="flex:1;">
                                <span class="btn-text">Publicar</span>
                                <span class="spinner" style="display:none; width:20px; height:20px;"></span>
                            </button>
                            <button type="button" class="btn outline" id="btn-pub-cancel" style="display:none;" onclick="cancelPubEdit()">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Columna Derecha: Lista -->
                <div class="admin-list-card">
                    <h3>Publicaciones Activas</h3>
                    <div id="pub-list-container">
                        <p style="color:var(--text-muted)">Cargando publicaciones...</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN AGENDA -->
        <section id="sec-agenda" class="admin-section">
            <div class="admin-panel-grid">
                <!-- Columna Izquierda: Formulario -->
                <div class="admin-form-card">
                    <h3>Nuevo Evento</h3>
                    <form id="form-agenda" class="contact-form">
                        <div class="form-group">
                            <label>Título del Evento</label>
                            <input type="text" id="agenda-title" required>
                        </div>
                        <div class="form-group" style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                            <div>
                                <label>Fecha</label>
                                <input type="date" id="agenda-date" required>
                            </div>
                            <div>
                                <label>Estado</label>
                                <select id="agenda-status" required>
                                    <option value="confirmado">Confirmado</option>
                                    <option value="realizado">Realizado</option>
                                    <option value="cancelado">Cancelado</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Etiqueta / Tipo (Ej: Conversatorio)</label>
                            <input type="text" id="agenda-tag" required>
                        </div>
                        <div class="form-group">
                            <label>Disertantes / Descripción corta</label>
                            <input type="text" id="agenda-speakers" required>
                        </div>
                        <div class="form-group">
                            <label>Foto/Banner (opcional)</label>
                            <input type="file" id="agenda-img" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Link de Inscripción (opcional)</label>
                            <input type="url" id="agenda-link" placeholder="https://forms.gle/...">
                        </div>
                        <div class="form-group">
                            <label>Detalle Completo (opcional)</label>
                            <textarea id="agenda-content"></textarea>
                        </div>
                        <div style="display:flex; gap:1rem; margin-top:1rem;">
                            <button type="submit" class="btn" id="btn-agenda-submit" style="flex:1;">
                                <span class="btn-text">Guardar Evento</span>
                                <span class="spinner" style="display:none; width:20px; height:20px;"></span>
                            </button>
                            <button type="button" class="btn outline" id="btn-agenda-cancel" style="display:none;" onclick="cancelAgendaEdit()">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Columna Derecha: Lista -->
                <div class="admin-list-card">
                    <h3>Eventos Programados</h3>
                    <div id="agenda-list-container">
                        <p style="color:var(--text-muted)">Cargando agenda...</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    
    <!-- Quill Rich Text Editor -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- Config & Logic -->
    <script src="../../js/core/firebase-config.js"></script>
    <script src="../../js/services/auth.js"></script>
    <script src="../../js/services/admin.js"></script>
</body>
</html>
