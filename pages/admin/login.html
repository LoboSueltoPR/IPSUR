<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Panel — IPSUR</title>
    <link rel="icon" href="../../assets/images/logo.png">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../../js/core/paths.js"></script>
</head>
<body class="admin-body">
    <main class="login-main">
        <div class="login-card">
            <div class="login-header">
                <img src="../../assets/images/logo.png" alt="IPSUR Logo" class="login-logo">
                <h2>Panel de Administración</h2>
                <p>Ingresá tus credenciales para continuar</p>
            </div>
            
            <form id="login-form" class="contact-form">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                
                <div id="login-error" class="form-error" style="display: none; color: #ef4444; margin-bottom: 1rem; font-size: 0.9rem; text-align: center;"></div>
                
                <button type="submit" class="btn" id="btn-login" style="width: 100%; border-radius: 8px;">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="spinner" id="login-spinner" style="display:none; width:20px; height:20px;"></span>
                </button>
            </form>
            <div class="login-footer">
                <a href="../../index.html">← Volver al sitio web</a>
            </div>
        </div>
    </main>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    
    <!-- Config & Logic -->
    <script src="../../js/core/firebase-config.js"></script>
    <script src="../../js/services/auth.js"></script>
</body>
</html>
